name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Python syntax
        run: python -m compileall -q agent/app tests
      - name: Unit tests (setup wizard, budget, shell timeout / Stop)
        run: pip install -q httpx pytest pydantic && python -m pytest -q tests
      - name: Shell syntax
        run: for f in scripts/*.sh tests/*.sh; do bash -n "$f"; done
      - name: Compose files
        run: INTERNAL_SECRET=ci docker compose -f docker-compose.yml -f docker-compose.build.yml -f tests/docker-compose.ci.yml config -q

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: End-to-end smoke test (mock LLM)
        run: bash tests/smoke.sh

  installer-linux:
    # install.sh exactly as a user runs it (prebuilt image from ghcr.io), then --uninstall
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Install
        run: DEVTEAM_REF=${{ github.sha }} DEVTEAM_DIR=$RUNNER_TEMP/ai-devteam bash install.sh
      - name: Team is up
        run: |
          port=$(grep '^UI_PORT=' $RUNNER_TEMP/ai-devteam/.env | cut -d= -f2)
          # install.sh waits for the Lead only; the workers may need a few more seconds
          for i in $(seq 1 24); do
            curl -fs "http://127.0.0.1:$port/api/team" > team.json && python3 -c 'import json; t=json.load(open("team.json")); assert all(v["ok"] for v in t.values())' 2>/dev/null && break
            sleep 5
          done
          python3 -c 'import json; t=json.load(open("team.json")); assert all(v["ok"] for v in t.values()), t; print("6 agents ok")'
      - name: Stop and start
        run: cd $RUNNER_TEMP/ai-devteam && docker compose stop && docker compose start && sleep 5 && docker compose ps
      - name: Uninstall
        run: |
          DEVTEAM_REF=${{ github.sha }} DEVTEAM_DIR=$RUNNER_TEMP/ai-devteam bash install.sh --uninstall
          test ! -d $RUNNER_TEMP/ai-devteam
          test -z "$(docker ps -aq --filter name=devteam-)"
          test -z "$(docker volume ls -q | grep -E 'devteam|ai-devteam' || true)"
          test -z "$(docker images -q ghcr.io/nikvladimirovich2/ai-devteam)"
          echo "uninstalled cleanly"
