name: Bug report
description: Something does not work as described
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Never paste API keys, Git tokens, passwords or `.env` contents.** Security problems: see SECURITY.md, not a public issue.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what you got.
    validations: { required: true }
  - type: textarea
    id: logs
    attributes:
      label: Logs / task report
      description: "`docker compose logs lead <role>` or the final report of the task (remove secrets)."
      render: text
  - type: input
    id: model
    attributes:
      label: Model and provider
      placeholder: hosted_vllm/Qwen3-32B on vLLM 0.x with --tool-call-parser hermes
  - type: dropdown
    id: runtime
    attributes:
      label: Runtime
      options: [Docker Compose on Linux, wslc on Windows, Other]
  - type: input
    id: version
    attributes:
      label: Version / commit
